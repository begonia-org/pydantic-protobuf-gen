name: tests

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  protobuf-matrix:
    name: protobuf ${{ matrix.protobuf }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per protobuf release: protobuf is one-version-per-interpreter, and
        # the supported range spans three descriptor-API regimes — runtime descriptors
        # expose only `label` up to 6.31, both `label` and `is_repeated` from 6.32.1,
        # and only `is_repeated` from 7.x.
        #   5.29.0 - the floor, set by the gencode version of the committed vendored
        #            *_pb2.py files (protobuf refuses a runtime older than gencode)
        #   6.33.6 - `label` deprecated, `is_repeated` available
        #   7.35.1 - lowest 7.x that co-resolves with the declared dependency set
        #   7.36.2 - current 7.x
        # 7.34.0 is deliberately absent: `grpcio-tools` 1.83+ requires `protobuf>=7.35.1`
        # and pip cannot complete the resolution below that (ResolutionImpossible), so
        # nobody can install this package with protobuf 7.34.0 in the first place.
        # The generator's own runtime compatibility is wider than that — see
        # tmp/probe-enum-map/matrix.sh, which runs the suite with no protoc dependency.
        protobuf: ["5.29.0", "6.33.6", "7.35.1", "7.36.2"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The editable install brings the declared runtime and test dependencies —
          # pytest, pytest-asyncio, googleapis-common-protos, pgvector and zstandard are
          # all listed in pyproject.toml. The matrix release is passed in the *same*
          # resolution on purpose: pinning protobuf in a second command leaves the
          # companion packages (grpcio-tools, googleapis-common-protos) at versions that
          # reject the pinned runtime, and their gencode then fails to load —
          # `VersionError: Detected incompatible Protobuf Gencode/Runtime versions`.
          python -m pip install -e . "protobuf==${{ matrix.protobuf }}"

      - name: Show versions
        run: |
          python -c "import sys, google.protobuf; print(sys.version); print('protobuf', google.protobuf.__version__)"
          python -m pip list --format=freeze | grep -E '^(protobuf|grpcio-tools|googleapis-common-protos)='

      - name: Tests
        # test_performance.py imports `example.client`, which does not exist in this
        # repo (it needs a running server), so it is excluded rather than marked.
        run: python -m pytest example/tests --ignore=example/tests/test_performance.py -q
