name: tests

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  protobuf-matrix:
    name: protobuf ${{ matrix.protobuf }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One job per protobuf release: protobuf is one-version-per-interpreter, and
        # the supported range spans three descriptor-API regimes — runtime descriptors
        # expose only `label` up to 6.31, both `label` and `is_repeated` from 6.32.1,
        # and only `is_repeated` from 7.x.
        #   5.29.0 - the floor, set by the gencode version of the committed vendored
        #            *_pb2.py files (protobuf refuses a runtime older than gencode)
        #   6.33.6 - `label` deprecated, `is_repeated` available
        #   7.35.1 - lowest 7.x that co-resolves with the declared dependency set
        #   7.36.2 - current 7.x
        # 7.34.0 is deliberately absent: `grpcio-tools` 1.83+ requires `protobuf>=7.35.1`
        # and pip cannot complete the resolution below that (ResolutionImpossible), so
        # nobody can install this package with protobuf 7.34.0 in the first place.
        # The generator's own runtime compatibility is wider than that — see
        # tmp/probe-enum-map/matrix.sh, which runs the suite with no protoc dependency.
        protobuf: ["5.29.0", "6.33.6", "7.35.1", "7.36.2"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The editable install brings the declared runtime and test dependencies —
          # pytest, pytest-asyncio, googleapis-common-protos, pgvector and zstandard are
          # all listed in pyproject.toml. The matrix release is passed in the *same*
          # resolution on purpose: pinning protobuf in a second command leaves the
          # companion packages (grpcio-tools, googleapis-common-protos) at versions that
          # reject the pinned runtime, and their gencode then fails to load —
          # `VersionError: Detected incompatible Protobuf Gencode/Runtime versions`.
          python -m pip install -e . "protobuf==${{ matrix.protobuf }}"

      - name: Show versions
        run: |
          python -c "import sys, google.protobuf; print(sys.version); print('protobuf', google.protobuf.__version__)"
          python -m pip list --format=freeze | grep -E '^(protobuf|grpcio-tools|googleapis-common-protos)='

      - name: Building must not rewrite the vendored generated code
        # setup.py recompiles protobuf_pydantic_gen/pydantic_pb2.py during the build
        # and the protoc version behind it sets the gencode (and therefore the runtime
        # floor). If a build rewrites the committed file, the declared floor no longer
        # describes the package — fail loudly instead. One row is enough; the build is
        # identical across the matrix.
        if: matrix.protobuf == '5.29.0'
        run: git diff --exit-code -- protobuf_pydantic_gen/

      - name: Generated code must be current
        # Mirrors `make -C example/protos py` and compares the result with the
        # checked-in output, ignoring the generated `@Time` header. It runs in the
        # lock environment (`uv sync --frozen`) rather than the matrix environment on
        # purpose: the generated output depends on the *generation* toolchain, not
        # just the source — the generator formats with `ruff` (a dev dependency;
        # without it, `ruff check --fix` silently fails and the output keeps unused
        # imports) and the pb2_grpc files embed grpcio-tools' version as
        # `GRPC_GENERATED_VERSION`. Only the lock pins both to the versions that
        # produced the committed artifacts.
        if: matrix.protobuf == '5.29.0'
        run: |
          python -m pip install -q uv
          uv sync --frozen
          mkdir -p /tmp/gen/pb /tmp/gen/models
          PATH="$PWD/.venv/bin:$PATH" .venv/bin/python -m grpc_tools.protoc \
            --proto_path=example/protos --proto_path=. \
            --python_out=/tmp/gen/pb --pyi_out=/tmp/gen/pb --grpc_python_out=/tmp/gen/pb \
            --pydantic_out=/tmp/gen/models example/protos/*.proto
          sed -i '/from/!s/import \(.*\) as/from . import \1 as/g' /tmp/gen/pb/*pb2*.py
          status=0
          for generated in /tmp/gen/models/* /tmp/gen/pb/*; do
            checked_in="example/$(basename "$(dirname "$generated")")/$(basename "$generated")"
            diff -I '@Time' "$checked_in" "$generated" || status=1
          done
          if [ "$status" != 0 ]; then
            echo "::error::checked-in generated code is stale — run 'make -C example/protos py' in the lock environment and commit the result"
            exit 1
          fi

      - name: Tests
        # test_performance.py imports `example.client`, which does not exist in this
        # repo (it needs a running server), so it is excluded rather than marked.
        run: python -m pytest example/tests --ignore=example/tests/test_performance.py -q
