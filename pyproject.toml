[project]
name = "protobuf-pydantic-gen"
version = "0.1.9"
description = "A tool for converting between Pydantic models and Protobuf messages, specifically enabling the generation of Pydantic BaseModel classes from .proto files."
requires-python = ">=3.9"
authors = [
    { name = "geebytes", email = "vforfreedom96@gmail.com" }
]
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "grpcio>=1.50.0",
    "grpcio-tools>=1.50.0",
    "protobuf>=5.27.0,<7.0.0",
    "pydantic>=2.4.1",
    "jinja2>=3.0.0",
    "peewee>=3.17.5",
    "sqlmodel>=0.0.19",
    "inflection>=0.5.1",
    "pydantic-core>=2.20.0",
    "annotated-types>=0.7.0",
    "autopep8>=2.3.1",
    "starlette>=0.46.2",
    "googleapis-common-protos>=1.70.0",
    "zstandard>=0.23.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pydantic-settings>=2.10.1",
    "pgvector>=0.4.2",
    "requests>=2.32.5",
]


[project.scripts]
protoc-gen-pydantic = 'protobuf_pydantic_gen.generator:main'

[project.optional-dependencies]
auth = [
    "asyncpg>=0.30.0",
]
[tool.setuptools]
package-dir = {"protobuf_pydantic_gen" = "protobuf_pydantic_gen"}

[tool.setuptools.packages.find]
where = ["."]
include = ["protobuf_pydantic_gen*"]

[tool.setuptools.package-data]
# Ship the Jinja templates AND the canonical pydantic.proto so consumers
# compile against the always-current option schema (proto3 `optional` presence
# on numeric constraints requires the matching proto, else `ge: 0` is dropped).
"protobuf_pydantic_gen" = ["protobuf_pydantic_gen/*.j2", "protobuf_pydantic_gen/pydantic.proto"]

[build-system]
requires = ["setuptools>=42", "wheel", "grpcio-tools>=1.50.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=1.16.0",
    "ruff>=0.11.13",
    "pre-commit>=3.0.0",
]
[tool.uv]
package = true
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
